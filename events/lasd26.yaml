# LASD26 — No Shortcuts Time Trial, Santa Monica → San Diego, 2026-10-23.
#
# One file per event (TRACKER_SPEC.md §7). Loaded by `npm run track:sync`
# (or POST /api/track/sync as an admin), which upserts it into the Tracker*
# tables; the GPX named under `route` sits next to this file.
#
# PAIRS, NOT TWO TEAMS (owner, 2026-10-15: "we are running two by two …
# it's not like a track for team A, team B … we just have the roster").
# ONE entry — the crew — with two slots, A and B, that any runner on the
# roster can take. Progress is shared (the pair runs side by side); each
# runner's legs and miles are their own. The two race registrations are
# still real, so the slots are called A and B.
#
# PLACEHOLDERS the owner fills before race week (spec §15):
#   - the 16 runner names (device ids may stay as they are: each runner
#     types theirs into Traccar Client — see /track/lasd26/join)
#   - checkpoint towns and miles from the REAL route
#   - events/lasd26.gpx is a BRouter-generated stand-in, not the official course
#
# Participant identity: a runner's id is their device external_id (swap a
# phone = edit the external_id here, not the name); or give an explicit
# `id:`. Reordering or renaming lines keeps everyone's legs.
#
# THE VAN WITH THE SCREEN OFF (owner, 2026-10-15): the van phone runs
# Traccar Client too (source: traccar, a vehicle device) — a background
# service, no page to keep open. The web van page (/track/lasd26/van)
# stays as the fallback for any phone without the app.
#
# Secrets: the repo is public. `$TRACKER_CREW_KEY_LASD26` is read from the
# environment (Vercel → Settings → Environment Variables; .env.local on a
# laptop). It is written to the database only when it comes from the env
# var or the database is local.

slug: lasd26
name: "No Shortcuts TT · LA to SD"
kind: relay
start_time: "2026-10-23T05:00:00-07:00"
timezone: America/Los_Angeles
units: imperial
route: lasd26.gpx
public_delay_s: 0
crew_key: "$TRACKER_CREW_KEY_LASD26"

entries:
  - name: "No Shortcuts × Just Friends"
    short_name: JF
    color: "#D0F858"
    slots: 2
    slot_names: ["A", "B"]
    participants:
      - { name: "Runner 1", initials: "R1", device: { source: traccar, external_id: "lasd26-r01" } }
      - { name: "Runner 2", initials: "R2", device: { source: traccar, external_id: "lasd26-r02" } }
      - { name: "Runner 3", initials: "R3", device: { source: traccar, external_id: "lasd26-r03" } }
      - { name: "Runner 4", initials: "R4", device: { source: traccar, external_id: "lasd26-r04" } }
      - { name: "Runner 5", initials: "R5", device: { source: traccar, external_id: "lasd26-r05" } }
      - { name: "Runner 6", initials: "R6", device: { source: traccar, external_id: "lasd26-r06" } }
      - { name: "Runner 7", initials: "R7", device: { source: traccar, external_id: "lasd26-r07" } }
      - { name: "Runner 8", initials: "R8", device: { source: traccar, external_id: "lasd26-r08" } }
      - { name: "Runner 9", initials: "R9", device: { source: traccar, external_id: "lasd26-r09" } }
      - { name: "Runner 10", initials: "R10", device: { source: traccar, external_id: "lasd26-r10" } }
      - { name: "Runner 11", initials: "R11", device: { source: traccar, external_id: "lasd26-r11" } }
      - { name: "Runner 12", initials: "R12", device: { source: traccar, external_id: "lasd26-r12" } }
      - { name: "Runner 13", initials: "R13", device: { source: traccar, external_id: "lasd26-r13" } }
      - { name: "Runner 14", initials: "R14", device: { source: traccar, external_id: "lasd26-r14" } }
      - { name: "Runner 15", initials: "R15", device: { source: traccar, external_id: "lasd26-r15" } }
      - { name: "Runner 16", initials: "R16", device: { source: traccar, external_id: "lasd26-r16" } }
    # The van phone on Traccar Client (screen off), with the web page as a
    # fallback: both report as the vehicle.
    vehicle_device: { source: traccar, external_id: "lasd26-van" }
    vehicle_devices:
      - { source: web, external_id: "lasd26-van-web" }

# Miles are measured along the STAND-IN GPX (142.4 mi, BRouter, coast-hugging
# — the official course is ~134 mi); the owner replaces towns / exchange
# points and miles from the real route (spec §15.4). `kind: town` rows feed
# the Meet us tab; a mile past the route end is clamped to the finish.
checkpoints:
  - { name: "Santa Monica Pier", kind: start, mile: 0 }
  - { name: "Manhattan Beach", kind: town, mile: 12.7 }
  - { name: "Long Beach", kind: town, mile: 34.9 }
  - { name: "Huntington Beach", kind: town, mile: 48.3 }
  - { name: "Newport Beach", kind: town, mile: 53.6 }
  - { name: "Laguna Beach", kind: town, mile: 64.1 }
  - { name: "Dana Point", kind: town, mile: 71.6 }
  - { name: "San Clemente", kind: town, mile: 78.6 }
  - { name: "Oceanside", kind: town, mile: 103.9 }
  - { name: "Carlsbad", kind: town, mile: 107.4 }
  - { name: "Encinitas", kind: town, mile: 116.2 }
  - { name: "Del Mar", kind: town, mile: 123.0 }
  - { name: "La Jolla", kind: town, mile: 131.4 }
  - { name: "Pacific Beach", kind: town, mile: 137.5 }
  - { name: "Ocean Beach Pier", kind: finish, mile: 142.4 }

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@700&display=swap">
<style>html,body{margin:0;background:#F4F3EE}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* THE END SCREEN (owner, 2026-10-30: "And a thank you for opting in end
 * screen"). The last card of an Instagram carousel of posters, the pair of
 * scripts/title-card.html: THANK YOU in ink and FOR OPTING IN in the fall
 * brown, each line fitted to the measure in Archivo Black on the poster's
 * cream, the nameplate rule, and the sign-off every poster ends on — FOR
 * YOURSELF AND OTHERS — in mono at the foot. No address, no handle (the
 * sticker rule). ?w=1080&h=1920 for a story. Rendered by og-render.mjs:
 *   node scripts/og-render.mjs end-card.html public/row100k/title/thank-you-post.png 1080 1350 */
const q = new URLSearchParams(location.search);
const W = Number(q.get("w")) || 1080, H = Number(q.get("h")) || 1350;
const PAPER = "#F4F3EE", INK = "#15171A", BROWN = "#6F4A2F", GRAY = "#8a8a85";
const c = document.getElementById("c"); c.width = W; c.height = H;
const fit = (ctx, text, max) => { let s = 400; for (;;) { ctx.font = `${s}px "Archivo Black"`; if (ctx.measureText(text).width <= max || s <= 40) return s; s -= 1; } };
async function draw() {
  await document.fonts.load('150px "Archivo Black"');
  await document.fonts.load('bold 20px "Space Mono"');
  await document.fonts.ready;
  const ctx = c.getContext("2d");
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  const measure = W * 0.86, x0 = (W - measure) / 2;
  const lines = [{ t: "THANK YOU", color: INK }, { t: "FOR", color: INK }, { t: "OPTING IN", color: BROWN }];
  /* Each line as big as the measure allows, the short one no bigger than
   * the line above it, stacked at .9 leading; the block centred. */
  let prev = Infinity;
  for (const l of lines) { l.size = Math.min(fit(ctx, l.t, measure), prev); prev = l.size; }
  const lead = (s) => s * 0.9;
  const blockH = lines.reduce((a, l) => a + lead(l.size), 0);
  let y = (H - blockH) / 2 + lead(lines[0].size) * 0.8;
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  for (const l of lines) {
    ctx.font = `${l.size}px "Archivo Black"`; ctx.fillStyle = l.color;
    ctx.fillText(l.t, x0, y);
    y += lead(l.size);
  }
  /* The nameplate rule under the block, and the sign-off at the foot. */
  const ruleY = y - lead(lines[2].size) + lines[2].size * 0.14;
  ctx.fillStyle = INK; ctx.fillRect(x0, ruleY, measure, Math.max(3, Math.round(lines[0].size * 0.03)));
  ctx.font = 'bold 26px "Space Mono"'; ctx.fillStyle = GRAY; ctx.textAlign = "left";
  ctx.save(); ctx.letterSpacing = "0.18em"; ctx.fillText("FOR YOURSELF AND OTHERS", x0, H - 80); ctx.restore();
  document.title = "done";
}
draw();
</script>
</body>
</html>

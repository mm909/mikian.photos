<!doctype html>
<!-- The link card for /ring-every-bell, 1200 x 630. Rendered to
     public/ring-every-bell/og.png with headless Chrome:

       chrome --headless=new --hide-scrollbars --window-size=1200,630 \
         --virtual-time-budget=8000 \
         --screenshot=public/ring-every-bell/og.png scripts/food-relays/og-bells.html

     No date and no address, for the reasons in og-glizzy.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ring Every Bell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,800&display=block" rel="stylesheet" />
    <style>
      html, body { margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden; position: relative;
        background: #fbf4e6; color: #1c1a17;
        font-family: "Barlow Condensed", Impact, sans-serif;
      }
      .pad { position: absolute; inset: 0; padding: 46px 56px 0; }
      .chips { display: flex; gap: 12px; }
      .chip {
        font-weight: 700; font-size: 26px; letter-spacing: 0.09em; text-transform: uppercase;
        padding: 6px 18px; border: 3px solid #1c1a17; border-radius: 999px; background: #fffdf8; line-height: 1.2;
      }
      .chip.on { background: #5c2d91; color: #fff; }
      .chip.alt { background: #f6b91a; }
      h1 {
        margin: 22px 0 0; font-style: italic; font-weight: 800; text-transform: uppercase;
        font-size: 158px; line-height: 0.84; letter-spacing: 0;
      }
      h1 span { display: block; }
      h1 .hl { color: #5c2d91; }
      .art { position: absolute; right: 86px; top: 74px; width: 390px; transform: rotate(-13deg); filter: drop-shadow(12px 14px 0 rgba(28, 26, 23, 0.16)); }
      .bar {
        position: absolute; left: 0; right: 0; bottom: 0; height: 98px; background: #1c1a17; color: #fff;
        display: flex; align-items: center; gap: 30px; padding: 0 56px;
        font-style: italic; font-weight: 800; font-size: 44px; text-transform: uppercase; line-height: 1; white-space: nowrap;
      }
      .bar b { color: #f6b91a; font-weight: 800; }
      .bar i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); flex: none; }
    </style>
  </head>
  <body>
    <div class="pad">
      <div class="chips">
        <span class="chip on">Las Vegas</span>
        <span class="chip">Team relay</span>
        <span class="chip alt">On foot</span>
      </div>
      <h1>
        <span>Ring</span>
        <span>Every</span>
        <span class="hl">Bell</span>
      </h1>
    </div>
    <svg class="art" viewBox="0 0 128 128" aria-hidden="true">
      <circle cx="64" cy="106" r="12" fill="#f6b91a" stroke="#1c1a17" stroke-width="6" />
      <path d="M64 16 C40 16 28 36 28 60 V78 L14 98 H114 L100 78 V60 C100 36 88 16 64 16 Z" fill="#5c2d91" stroke="#1c1a17" stroke-width="6" stroke-linejoin="round" />
      <path d="M44 58 C44 44 50 34 60 30" fill="none" stroke="#d6247f" stroke-width="7" stroke-linecap="round" />
      <rect x="55" y="6" width="18" height="14" rx="6" fill="#5c2d91" stroke="#1c1a17" stroke-width="6" />
    </svg>
    <div class="bar"><b>The Taco Bell 100K</b><i></i><span>24 bells</span><i></i><span>One loop, one day</span></div>
  </body>
</html>

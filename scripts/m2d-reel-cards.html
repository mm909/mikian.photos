<!doctype html>
<!-- M2D REEL GRAPHICS (owner, 2026-11-25: "Can I get some graphics that might
     help in these reels to explain how much money Concept2 is giving?").
     One card per ?card=, 1080x1920 on a transparent ground, to lay over the
     video. No site address on any of them (CLAUDE.md: no address on a
     sticker). Rendered by headless Chrome:
       chrome --headless --screenshot=out.png --window-size=1080,1920
              --default-background-color=00000000 "file:///.../m2d-reel-cards.html?card=c2" -->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;700&family=Space+Mono:wght@400;700&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  .card { width: 860px; background: #fff; color: #111; padding: 64px 64px 56px; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
  .eye { font: 700 26px/1 "Space Mono", monospace; letter-spacing: .14em; text-transform: uppercase; display: flex; justify-content: space-between; padding-bottom: 18px; border-bottom: 4px solid #111; }
  .eye b { color: #0077B6; }
  h1 { font: 400 96px/0.98 "Archivo Black", sans-serif; text-transform: uppercase; margin: 34px 0 10px; letter-spacing: -.01em; }
  .sub { font: 700 28px/1.3 "Space Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #6b6b6b; margin-bottom: 30px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 0; border-bottom: 2px solid #dcdcdc; }
  .row .k { font: 400 54px/1 "Archivo Black", sans-serif; }
  .row .v { font: 700 58px/1 "Space Mono", monospace; color: #0077B6; }
  .row.zero .v { color: #b9b9b9; }
  .foot { font: 700 24px/1.4 "Space Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #6b6b6b; margin-top: 26px; }
  .big { font: 400 230px/0.9 "Archivo Black", sans-serif; color: #0077B6; margin: 30px 0 6px; letter-spacing: -.03em; }
  .ch { padding: 26px 0; border-bottom: 2px solid #dcdcdc; }
  .ch .n { font: 400 56px/1 "Archivo Black", sans-serif; text-transform: uppercase; }
  .ch .w { font: 400 30px/1.3 "Archivo", sans-serif; color: #555; margin-top: 10px; }
  .step { display: flex; gap: 30px; padding: 26px 0; border-bottom: 2px solid #dcdcdc; align-items: baseline; }
  .step .i { font: 400 70px/1 "Archivo Black", sans-serif; color: #0077B6; width: 56px; }
  .step .t { font: 700 40px/1.2 "Archivo", sans-serif; }
  .step .t small { display: block; font: 400 28px/1.3 "Archivo", sans-serif; color: #666; margin-top: 6px; }
  .mark { font: 400 34px/1 "Archivo Black", sans-serif; letter-spacing: .02em; }
  .mark i { font-style: normal; color: #0077B6; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
const q = new URLSearchParams(location.search).get("card") || "c2";
const eye = (l, r) => `<div class="eye"><span>${l}</span><b>${r}</b></div>`;
const row = (k, v, zero) => `<div class="row${zero ? " zero" : ""}"><span class="k">${k}</span><span class="v">${v}</span></div>`;
const M2D = `<span class="mark">M<i>2</i>D</span>`;
const cards = {
  c2: eye("Concept2", "Nov 26 – Dec 24") +
    `<h1>Pass 100K.<br/>They give.</h1><div class="sub">2¢ a km for the first 100 km · 4¢ for every km after</div>` +
    row("50K", "$0", true) + row("100K", "$2") + row("150K", "$4") + row("200K", "$6") + row("300K", "$10") +
    `<div class="foot">Register with Concept2 for it to count</div>`,
  rowtember: eye("ROWTEMBER", "We match") +
    `<h1>4¢ a km.<br/>From meter one.</h1><div class="sub">Concept2's 4¢, matched on every km you log · no minimum</div>` +
    row("10K", "$0.40") + row("50K", "$2") + row("100K", "$4") + row("200K", "$8") + row("300K", "$12"),
  both: eye("Together", "To charity") +
    `<h1>What your<br/>meters raise</h1><div class="sub">Concept2 + ROWTEMBER</div>` +
    row("50K", "$2") + row("100K", "$6") + row("200K", "$14") + row("300K", "$22") +
    `<div class="foot">Under 100K: 4¢ a km · past 100K: 8¢ a km</div>`,
  rate: eye(M2D, "Meters to dollars") + `<div class="big">4¢</div><div class="sub" style="margin:0">a kilometer, matched by ROWTEMBER<br/>from your very first meter</div>`,
  charities: eye("You pick", "Where it goes") +
    `<h1>Three local<br/>charities</h1>` +
    `<div class="ch"><div class="n">Candlelighters</div><div class="w">Support for kids with cancer and their families</div></div>` +
    `<div class="ch"><div class="n">Shine A Light</div><div class="w">Outreach and housing for people living in the flood tunnels</div></div>` +
    `<div class="ch" style="border:0"><div class="n">Project Inclusion</div><div class="w">Social opportunities for neurodivergent and disabled adults</div></div>`,
  join: eye(M2D, "How to opt in") +
    `<h1>Three<br/>steps</h1>` +
    `<div class="step"><span class="i">1</span><span class="t">Make a Concept2 Logbook<small>and sign up for the Holiday Challenge</small></span></div>` +
    `<div class="step"><span class="i">2</span><span class="t">Opt in to M2D on ROWTEMBER<small>and pick your charity</small></span></div>` +
    `<div class="step" style="border:0"><span class="i">3</span><span class="t">Row, and log it<small>Nov 26 to Dec 24</small></span></div>`,
};
document.getElementById("card").innerHTML = cards[q] || cards.c2;
document.fonts.ready.then(() => (document.title = "done"));
</script>
</body>
</html>
